name: Build and Release iPXE Tethering Boot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag version"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt update
          sudo apt install -y git build-essential liblzma-dev mtools syslinux isolinux genisoimage zip

      - name: Clone official iPXE source
        run: |
          git clone --depth 1 https://github.com/ipxe/ipxe.git ipxe-source

      - name: Configure iPXE features & USB stack
        run: |
          # Use local override headers to guarantee options are enabled
          mkdir -p ipxe-source/src/config/local
          
          # Enable USB command, HTTPS, and extra protocols
          cat << 'EOF' > ipxe-source/src/config/local/general.h
          #define USB_CMD
          #define DOWNLOAD_PROTO_HTTPS
          #define PING_CMD
          #define CONSOLE_CMD
          EOF

          # Explicitly enable USB Host Controller Drivers (xHCI/EHCI/UHCI)
          cat << 'EOF' > ipxe-source/src/config/local/usb.h
          #define USB_HCD_XHCI
          #define USB_HCD_EHCI
          #define USB_HCD_UHCI
          EOF

      - name: Copy embedded boot script
        run: |
          cp boot.ipxe ipxe-source/src/boot.ipxe

      - name: Compile BIOS Tethering Binaries
        run: |
          cd ipxe-source/src
          make bin/ecm--ncm.usb bin/ecm--ncm.iso EMBED=boot.ipxe

      - name: Compile UEFI Tethering Binary
        run: |
          cd ipxe-source/src
          # Compile with explicit xhci debugging and embedded script
          make bin-x86_64-efi/ecm--ncm.efi EMBED=boot.ipxe

      - name: Stage Artifacts
        run: |
          mkdir -p staging/uefi/EFI/BOOT
          mkdir -p release-assets

          # UEFI staging
          cp ipxe-source/src/bin-x86_64-efi/ecm--ncm.efi staging/uefi/EFI/BOOT/BOOTX64.EFI
          (cd staging/uefi && zip -r ../../release-assets/ipxe-uefi-tether.zip EFI)

          # BIOS staging
          cp ipxe-source/src/bin/ecm--ncm.usb release-assets/ipxe-bios-tether.usb
          cp ipxe-source/src/bin/ecm--ncm.iso release-assets/ipxe-bios-tether.iso

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: "iPXE Tethering Build (${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }})"
          draft: false
          prerelease: false
          files: |
            release-assets/ipxe-uefi-tether.zip
            release-assets/ipxe-bios-tether.usb
            release-assets/ipxe-bios-tether.iso
