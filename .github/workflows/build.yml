name: Build Custom iPXE with USB Support

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git build-essential liblzma-dev mtools

      - name: Clone official iPXE repository
        run: |
          git clone --depth 1 https://github.com/ipxe/ipxe.git ipxe-source

      - name: Enable USB and HTTPS support
        run: |
          # Enable USB command
          sed -i 's/\/\* #define USB_CMD \*\//#define USB_CMD/' ipxe-source/src/config/general.h
          # Enable HTTPS download protocol
          sed -i 's/\/\* #define DOWNLOAD_PROTO_HTTPS \*\//#define DOWNLOAD_PROTO_HTTPS/' ipxe-source/src/config/general.h

      - name: Copy custom boot script into source folder
        run: |
          cp boot.ipxe ipxe-source/src/boot.ipxe

      - name: Compile Custom UEFI Binary
        run: |
          cd ipxe-source/src
          # Builds a standard x86_64 UEFI binary with your embedded script
          make bin-x86_64-efi/ipxe.efi EMBED=boot.ipxe

      - name: Prepare Output Files
        run: |
          mkdir -p output/EFI/BOOT
          cp ipxe-source/src/bin-x86_64-efi/ipxe.efi output/EFI/BOOT/BOOTX64.EFI

      - name: Upload Compiled Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom-usb-netboot-efi
          path: output/
