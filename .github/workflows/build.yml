name: Build and Release iPXE Tethering Boot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag version"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt update
          sudo apt install -y git build-essential liblzma-dev mtools syslinux isolinux genisoimage zip ca-certificates

      - name: Clone official iPXE source
        run: |
          git clone --depth 1 https://github.com/ipxe/ipxe.git ipxe-source

      - name: Configure iPXE features
        run: |
          mkdir -p ipxe-source/src/config/local
          
          # Enable USB command, HTTPS download support, and diagnostic utilities
          cat << 'EOF' > ipxe-source/src/config/local/general.h
          #define USB_CMD
          #define DOWNLOAD_PROTO_HTTPS
          #define PING_CMD
          #define CONSOLE_CMD
          #define NSLOOKUP_CMD
          #define REBOOT_CMD
          #define POWEROFF_CMD
          EOF

      - name: Copy embedded boot script
        run: |
          cp boot.ipxe ipxe-source/src/boot.ipxe

      - name: Compile BIOS Tethering Binaries
        run: |
          cd ipxe-source/src
          # Builds BIOS USB disk and ISO with full USB host + ECM/NCM drivers and trusted CA certs
          make bin/ipxe.usb bin/ipxe.iso EMBED=boot.ipxe TRUST=/etc/ssl/certs/ca-certificates.crt

      - name: Compile UEFI Tethering Binary
        run: |
          cd ipxe-source/src
          # Builds 64-bit EFI binary with full USB host + ECM/NCM drivers and trusted CA certs
          make bin-x86_64-efi/ipxe.efi EMBED=boot.ipxe TRUST=/etc/ssl/certs/ca-certificates.crt

      - name: Stage Artifacts
        run: |
          mkdir -p staging/uefi/EFI/BOOT
          mkdir -p release-assets

          # MediCat / Ventoy ready files (no unzipping needed)
          cp ipxe-source/src/bin-x86_64-efi/ipxe.efi release-assets/arch-netboot-tether.efi
          cp ipxe-source/src/bin/ipxe.iso release-assets/arch-netboot-tether.iso
          cp ipxe-source/src/bin/ipxe.usb release-assets/arch-netboot-tether.usb

          # Standalone FAT32 USB archive
          cp ipxe-source/src/bin-x86_64-efi/ipxe.efi staging/uefi/EFI/BOOT/BOOTX64.EFI
          (cd staging/uefi && zip -r ../../release-assets/ipxe-uefi-tether.zip EFI)

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
          name: "iPXE Tethering Build (${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }})"
          draft: false
          prerelease: false
          files: release-assets/*
